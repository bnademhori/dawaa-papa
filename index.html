<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع دواء الوالد 💊</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti للألعاب النارية كي يشرب الدواء -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body {
            font-family: 'Readex Pro', sans-serif;
            background: #090d16;
            background-image: 
                radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(99, 102, 241, 0.12) 0px, transparent 50%);
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .glow-emerald {
            box-shadow: 0 0 35px -5px rgba(16, 185, 129, 0.4);
        }
        .pulse-ring {
            animation: pulse-border 2s infinite;
        }
        @keyframes pulse-border {
            0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); }
            100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); }
        }
    </style>
</head>
<body class="min-h-screen text-slate-100 flex flex-col items-center justify-center p-4 relative overflow-x-hidden">

    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-7 relative z-10 shadow-2xl">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 pb-5 border-b border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-xl text-white shadow-lg shadow-cyan-500/20">
                    <i class="fa-solid font-black fa-pills"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black text-white tracking-tight">دواء الوالد</h1>
                    <p id="current-date" class="text-xs text-slate-400 font-light mt-0.5">جاري جلب التاريخ...</p>
                </div>
            </div>
            <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1.5 rounded-full">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span class="text-[11px] font-bold text-emerald-400 tracking-wide">مباشر</span>
            </div>
        </div>

        <!-- Dose Info -->
        <div class="mb-6">
            <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-5 relative overflow-hidden">
                <div class="flex justify-between items-start mb-2">
                    <span class="text-xs font-medium text-slate-400">جرعة اليوم المقررة</span>
                    <span class="text-[11px] font-semibold text-cyan-400 bg-cyan-500/10 border border-cyan-500/20 px-2.5 py-0.5 rounded-md">
                        <i class="fa-regular fa-clock ml-1"></i> 20:00 ليلاً
                    </span>
                </div>
                <div id="dose-display" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-yellow-500 my-1">
                    جاري الحساب...
                </div>
                
                <!-- العداد التنازلي لوقت الدواء -->
                <div id="timer-box" class="text-xs text-slate-400 mt-3 pt-3 border-t border-slate-800 flex justify-between items-center">
                    <span>متبقي على موعد الدواء:</span>
                    <span id="countdown-timer" class="font-bold text-cyan-400 font-mono">--:--:--</span>
                </div>
            </div>
        </div>

        <!-- Status Card -->
        <div id="status-card" class="rounded-2xl p-6 mb-7 transition-all duration-500 border bg-rose-500/10 border-rose-500/20 pulse-ring">
            <div class="flex items-center gap-4">
                <div id="status-icon-box" class="w-14 h-14 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-2xl text-rose-400 shrink-0">
                    <i id="status-icon" class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h2 id="status-title" class="text-lg font-bold text-rose-300">لم يتم أخذ الدواء بعد</h2>
                    <p id="status-subtitle" class="text-xs text-slate-400 mt-1 leading-relaxed">يرجى تفقد الوالد وتأكيد الأخذ عند الاقتضاء.</p>
                </div>
            </div>
        </div>

        <!-- Action Button -->
        <button id="take-btn" onclick="toggleDose()" class="w-full py-4 px-6 rounded-2xl font-bold text-base transition-all duration-300 flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-xl glow-emerald active:scale-95 cursor-pointer">
            <i id="btn-icon" class="fa-solid fa-circle-check text-xl"></i>
            <span id="btn-text">تأكيد أخذ الدواء الآن</span>
        </button>

        <div class="mt-6 text-center">
            <p id="last-updated" class="text-[11px] text-slate-500 flex items-center justify-center gap-1.5">
                <i class="fa-solid fa-wifi text-emerald-400"></i> خادم التزامن متصل
            </p>
        </div>
    </div>

    <!-- الأصوات -->
    <audio id="success-sound" src="https://assets.mixkit.co/active_storage/sfx/2019/2019-preview.mp3" preload="auto"></audio>
    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3" preload="auto"></audio>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBy54JBxm21l6Bv3TLOh1OarQLUBw9tDqU",
            authDomain: "dawaa-papa.firebaseapp.com",
            databaseURL: "https://dawaa-papa-default-rtdb.firebaseio.com",
            projectId: "dawaa-papa",
            storageBucket: "dawaa-papa.firebasestorage.app",
            messagingSenderId: "986527599522",
            appId: "1:986527599522:web:a7c355b9120d68d060c0fb",
            measurementId: "G-0K7JYJ0C77"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const startDate = new Date('2026-10-01');

        function calculateTodayDose() {
            const today = new Date();
            const todayStr = today.toISOString().slice(0, 10);
            
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('current-date').innerText = today.toLocaleDateString('ar-DZ', options);

            const diffTime = today - startDate;
            const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

            const dose = (diffDays % 2 === 0) ? "حبة كاملة (1)" : "نصف حبة (1/2)";
            document.getElementById('dose-display').innerText = dose;
            
            return todayStr;
        }

        const todayKey = calculateTodayDose();
        const doseRef = db.ref('medication/' + todayKey);

        let currentTakenState = false;

        doseRef.on('value', (snapshot) => {
            const data = snapshot.val();
            const isTaken = data && data.taken === true;
            currentTakenState = isTaken;
            updateUI(isTaken, data ? data.time : null);
        });

        function updateUI(isTaken, timeTaken) {
            const card = document.getElementById('status-card');
            const iconBox = document.getElementById('status-icon-box');
            const icon = document.getElementById('status-icon');
            const title = document.getElementById('status-title');
            const subtitle = document.getElementById('status-subtitle');
            const btn = document.getElementById('take-btn');
            const btnText = document.getElementById('btn-text');
            const btnIcon = document.getElementById('btn-icon');

            const now = new Date();
            const isAfter8PM = now.getHours() >= 20;

            if (isTaken) {
                // حالة تم أخذ الدواء
                card.className = "rounded-2xl p-6 mb-7 transition-all duration-500 border bg-emerald-500/10 border-emerald-500/30 glow-emerald";
                iconBox.className = "w-14 h-14 rounded-2xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-2xl text-emerald-400 shrink-0";
                icon.className = "fa-solid fa-circle-check";
                
                title.innerText = "تم أخذ الدواء بنجاح!";
                title.className = "text-lg font-bold text-emerald-300";
                subtitle.innerText = `تم تسجيل الجرعة اليوم على الساعة: ${timeTaken || '20:00'}`;

                btn.disabled = false;
                btn.className = "w-full py-3.5 px-6 rounded-2xl font-semibold text-sm transition-all duration-300 flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 cursor-pointer";
                btnText.innerText = "التراجع / إغلاق التحديد";
                btnIcon.className = "fa-solid fa-rotate-left";
            } else {
                // لم يتم أخذ الدواء بعد
                card.className = "rounded-2xl p-6 mb-7 transition-all duration-500 border bg-rose-500/10 border-rose-500/20 pulse-ring";
                iconBox.className = "w-14 h-14 rounded-2xl bg-rose-500/20 border border-rose-500/30 flex items-center justify-center text-2xl text-rose-400 shrink-0";
                icon.className = "fa-solid fa-triangle-exclamation";

                title.innerText = "لم يتم أخذ الدواء بعد";
                title.className = "text-lg font-bold text-rose-300";
                subtitle.innerText = "يرجى تفقد الوالد وتأكيد الأخذ عند الاقتضاء.";

                // حماية الزر قبل الساعة 20:00
                if (!isAfter8PM) {
                    btn.disabled = true;
                    btn.className = "w-full py-4 px-6 rounded-2xl font-bold text-base transition-all duration-300 flex items-center justify-center gap-3 bg-slate-800 text-slate-500 border border-slate-700 cursor-not-allowed opacity-60";
                    btnText.innerText = "مغلق حتى الساعة 20:00 ليلاً 🔒";
                    btnIcon.className = "fa-solid fa-lock";
                } else {
                    btn.disabled = false;
                    btn.className = "w-full py-4 px-6 rounded-2xl font-bold text-base transition-all duration-300 flex items-center justify-center gap-3 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white shadow-xl glow-emerald active:scale-95 cursor-pointer";
                    btnText.innerText = "تأكيد أخذ الدواء الآن";
                    btnIcon.className = "fa-solid fa-circle-check text-xl";
                }
            }
        }

        function toggleDose() {
            const now = new Date();
            if (now.getHours() < 20 && !currentTakenState) {
                alert("⚠️ لا يمكنك تأكيد الدواء قبل موعده (20:00 ليلاً)!");
                return;
            }

            doseRef.once('value', (snapshot) => {
                const data = snapshot.val();
                const currentState = data && data.taken;
                const timeStr = now.toLocaleTimeString('ar-DZ', { hour: '2-digit', minute: '2-digit' });

                if (!currentState) {
                    // تشغيل صوت النجاح والألعاب النارية
                    document.getElementById('success-sound').play();
                    confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                } else {
                    document.getElementById('click-sound').play();
                }

                doseRef.set({
                    taken: !currentState,
                    time: timeStr,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            });
        }

        // تحديث العداد التنازلي وفحص الوقت كل ثانية
        setInterval(() => {
            const now = new Date();
            const target = new Date();
            target.setHours(20, 0, 0, 0);

            if (now < target) {
                const diff = target - now;
                const hours = Math.floor(diff / (1000 * 60 * 60)).toString().padStart(2, '0');
                const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60)).toString().padStart(2, '0');
                const seconds = Math.floor((diff % (1000 * 60)) / 1000).toString().padStart(2, '0');
                document.getElementById('countdown-timer').innerText = `${hours}:${minutes}:${seconds}`;
            } else {
                document.getElementById('countdown-timer').innerText = "وصل موعد الدواء! 🔔";
                document.getElementById('countdown-timer').className = "font-bold text-emerald-400 animate-pulse";
            }

            // تحديث حالة الزر أوتوماتيكياً لما تلحق 20:00
            if (!currentTakenState) {
                updateUI(false, null);
            }
        }, 1000);
    </script>
</body>
</html>
